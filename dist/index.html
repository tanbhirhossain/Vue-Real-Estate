    <script>
      // Handle GitHub Pages SPA redirect from /404.html
      (function () {
        var location = window.location;
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })();
    </script>

  <body class="bg-white dark:bg-slate-950">
    <script>
      // Global patch to ensure fetch is configurable/writable
      // This solves issues with certain libraries trying to polyfill fetch incorrectly
      try {
        if (window.fetch) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: originalFetch,
            configurable: true,
            writable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Fetch polyfill patch failed', e);
      }
    </script>
